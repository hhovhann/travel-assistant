[project]
name = "travel-flight-agent-adk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-adk[a2a]>=2.11.0",
    "google-cloud-bigquery>=3.46.1",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::UserWarning"]
