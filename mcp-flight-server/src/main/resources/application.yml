server:
  # Loopback only by default; docker compose sets SERVER_ADDRESS=0.0.0.0 on its private network
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8081

spring:
  application:
    name: mcp-flight-server
  threads:
    virtual:
      enabled: true
  ai:
    mcp:
      server:
        name: flight-mcp-server
        version: 0.1.0
        instructions: "Flight search and booking tools aggregated from multiple (mock) providers"
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp

internal:
  # Shared service token; every MCP request must send it as a bearer token
  api-token: ${INTERNAL_API_TOKEN:}
