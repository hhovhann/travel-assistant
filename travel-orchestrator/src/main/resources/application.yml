server:
  # Loopback only by default; docker compose sets SERVER_ADDRESS=0.0.0.0
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 9000

spring:
  application:
    name: travel-orchestrator
  threads:
    virtual:
      enabled: true
  ai:
    openai:
      # Any OpenAI-compatible endpoint works: a local LM Studio / Ollama, Groq, ... (see .env.example)
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY}
      # Per LLM call; raise it for slow local models (each timeout is retried up to 3 times)
      timeout: ${OPENAI_TIMEOUT:120s}
      chat:
        model: ${OPENAI_MODEL:gpt-5-mini}

agents:
  # Base URLs; the agent card is read from <url>/.well-known/agent-card.json
  flight:
    url: ${AGENTS_FLIGHT_URL:http://localhost:8080}
  hotel:
    url: ${AGENTS_HOTEL_URL:http://localhost:8082}
  # Keep equal to the agents' AGENT_TIMEOUT_SECONDS; the orchestrator adds a short grace period on top
  timeout: ${AGENT_TIMEOUT_SECONDS:300}s

internal:
  # Shared service token, sent to the agents (their agent cards declare it)
  api-token: ${INTERNAL_API_TOKEN:}

guardrails:
  # Longest chat message accepted from a traveller
  max-input-chars: ${GUARDRAIL_MAX_INPUT_CHARS:2000}
  # Chat and plan requests per client IP per minute; each one can cost several LLM calls
  requests-per-minute: ${RATE_LIMIT_PER_MINUTE:20}
