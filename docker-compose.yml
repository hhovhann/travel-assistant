# Usage: create .env from .env.example (with OPENAI_API_KEY and INTERNAL_API_TOKEN), then:
#   docker compose up --build   and open http://localhost:9000
# Only the orchestrator is published, on the host's loopback. The agents and MCP servers are reachable only on the
# compose network, and only with the internal token.
x-internal-env: &internal-env
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN, e.g. INTERNAL_API_TOKEN=$(openssl rand -hex 32)}
  # Listen on the container network (the services default to loopback)
  SERVER_ADDRESS: 0.0.0.0

x-agent-env: &llm-env
  <<: *internal-env
  OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
  # For a local model use http://host.docker.internal:<port>/v1 (see .env.example)
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-120s}
  AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-300}

services:

  mcp-flight-server:
    build: { context: ., args: { MODULE: mcp-flight-server } }
    environment: *internal-env

  mcp-hotel-server:
    build: { context: ., args: { MODULE: mcp-hotel-server } }
    environment: *internal-env

  flight-agent:
    build: { context: ., args: { MODULE: flight-agent } }
    depends_on: [mcp-flight-server]
    # The MCP client connects at startup; retry until the MCP server is up
    restart: on-failure
    environment:
      <<: *llm-env
      FLIGHT_MCP_URL: http://mcp-flight-server:8081
      # Published in the agent card: the URL the orchestrator uses to call this agent
      A2A_PUBLIC_URL: http://flight-agent:8080

  hotel-agent:
    build: { context: ., args: { MODULE: hotel-agent } }
    depends_on: [mcp-hotel-server]
    restart: on-failure
    environment:
      <<: *llm-env
      HOTEL_MCP_URL: http://mcp-hotel-server:8083
      A2A_PUBLIC_URL: http://hotel-agent:8082

  travel-orchestrator:
    build: { context: ., args: { MODULE: travel-orchestrator } }
    ports: ["127.0.0.1:9000:9000"]
    depends_on: [flight-agent, hotel-agent]
    environment:
      <<: *llm-env
      AGENTS_FLIGHT_URL: http://flight-agent:8080
      AGENTS_HOTEL_URL: http://hotel-agent:8082
