server:
  port: 8080

spring:
  application:
    name: flight-agent
  threads:
    virtual:
      enabled: true
  ai:
    openai:
      # Any OpenAI-compatible endpoint works: a local LM Studio / Ollama, Groq, ... (see .env.example)
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY}
      # Per LLM call; raise it for slow local models (each timeout is retried up to 3 times)
      timeout: ${OPENAI_TIMEOUT:120s}
      chat:
        model: ${OPENAI_MODEL:gpt-5-mini}
    mcp:
      client:
        name: flight-agent
        type: SYNC
        request-timeout: 30s
        streamable-http:
          connections:
            flight-mcp:
              url: ${FLIGHT_MCP_URL:http://localhost:8081}

a2a:
  agent:
    public-url: ${A2A_PUBLIC_URL:http://localhost:8080}
  blocking:
    agent:
      # How long a blocking message/send waits for the LLM + tool calls to finish. A result that arrives
      # later is lost (the SDK closes the task's event queue), so keep it above the slowest expected run.
      timeout:
        seconds: ${AGENT_TIMEOUT_SECONDS:300}
